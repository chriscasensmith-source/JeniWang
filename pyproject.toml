[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrp-assistant"
version = "0.1.0"
description = "Local MRP Ordering Assistant: weekly JDE MRP message ingestion, order-date math, tier recommendations, and an auditable paper trail."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mrp = "mrp_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["mrp_assistant*"]

[tool.setuptools.package-data]
mrp_assistant = ["static/*"]
